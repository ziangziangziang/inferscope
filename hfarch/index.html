<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Atlas — a model's shape, from its metadata</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand">MODEL<b>ATLAS</b></div>
  <form id="go" class="ask">
    <input id="repo" placeholder="Qwen/Qwen3-4B" spellcheck="false"
           autocomplete="off" aria-label="Hugging Face model name">
    <button type="submit">draw</button>
  </form>
  <div class="src"><div id="src">reads config.json — no weights downloaded</div><div id="sum" class="sum"></div></div>
</header>

<main>
  <section class="stage">
    <svg id="svg" role="img" aria-label="Model architecture"></svg>
    <div class="hint" id="hint">type a model name to begin</div>
  </section>

  <aside class="side" id="side" hidden>
    <button class="close" id="close" title="close">×</button>
    <div id="detail"></div>
  </aside>
</main>

<div class="status" id="status" data-state="idle">
  <span class="dot"></span>
  <span class="what" id="stWhat">idle</span>
  <span class="steps" id="stSteps"></span>
  <span class="spacer"></span>
  <span class="meta" id="stMeta"></span>
</div>

<div class="err" id="err" hidden></div>
<script type="module" src="src/main.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Atlas — a model's shape, from its metadata</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand">MODEL<b>ATLAS</b></div>
  <form id="go" class="ask">
    <input id="repo" placeholder="Qwen/Qwen3-4B" spellcheck="false"
           list="recent" autocomplete="off" aria-label="Hugging Face model name">
    <datalist id="recent"></datalist>
    <button type="submit">draw</button>
  </form>
  <span class="drops" id="drops"></span>
  <button type="button" class="mode ghost" id="pick" title="draw the architecture a local config.json declares">open a config.json</button>
  <button class="mode" id="mode" title="switch between the flat and 3D drawing">3D</button>
  <div class="src"><div id="src">reads config.json — no weights downloaded</div><div id="sum" class="sum"></div></div>
</header>

<main>
  <section class="stage">
    <svg id="svg" role="img" aria-label="Model architecture"></svg>
    <div class="hint" id="hint">type a model name — or drop a config.json here</div>

    <!-- what failed, what was tried, and what would fix it -->
    <div class="why" id="why" hidden>
      <button class="close" id="whyclose" title="close">×</button>
    </div>
  </section>

  <aside class="side" id="side" hidden>
    <button class="close" id="close" title="close">×</button>
    <div id="detail"></div>
  </aside>
</main>

<input type="file" id="file" accept=".json,application/json" hidden>

<div class="status" id="status" data-state="idle">
  <span class="dot"></span>
  <span class="what" id="stWhat">idle</span>
  <span class="steps" id="stSteps"></span>
  <span class="spacer"></span>
  <span class="meta" id="stMeta"></span>
</div>

<div class="err" id="err" hidden></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
